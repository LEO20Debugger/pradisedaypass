name: CI

# Lint and build every pull request and every push to master.
# Deployment is handled by Vercel's GitHub integration, not this workflow:
#   - push to master   -> Production (pradisedaypass.vercel.app)
#   - any other branch -> Preview deployment with its own URL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Build project
      run: npm run build
